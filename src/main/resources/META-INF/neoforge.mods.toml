modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/5thlayer/${mod_id}/issues"
license = "LGPL-3.0-only"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Module's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# A Touch Of's Runtime, nested in the jar, which keeps the Pillar's Discovery record (#19).
[[dependencies.${mod_id}]]
modId = "atouchof"
type = "required"
versionRange = "${atouchof_range}"
ordering = "AFTER"
side = "BOTH"

# Shows the player a Bailiff came for and what it carries in Jade's tooltip (#13). Not required: its
# plugin is only loaded by Jade. The range is the Jade the plugin is compiled against.
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[26.1.11,)"
ordering = "NONE"
side = "BOTH"

# Shows information pages on the Pillar's things in EMI, each until its Discovery (#19). Not required:
# its plugin is only loaded by EMI. The range is the EMI port the plugin is compiled against.
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[1.1.24,)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "${mod_id}.mixins.json"
