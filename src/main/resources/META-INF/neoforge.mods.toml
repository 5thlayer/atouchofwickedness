modLoader = "javafml"
loaderVersion = "[4,)"
issueTrackerURL = "https://github.com/5thlayer/${mod_id}/issues"
license = "LGPL-3.0-only"

# processResources fills each dollar-brace value from gradle.properties, so this file names
# nothing of the Module's own.
[[mods]]
modId = "${mod_id}"
version = "${version}"
displayName = "${mod_name}"
authors = "5thlayer"
description = '''
${mod_description}
'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[${neoforge_version},)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[${minecraft_version}]"
ordering = "NONE"
side = "BOTH"

# Shows the player a Bailiff came for and what it carries in Jade's tooltip (#13). Not required: its
# plugin is only loaded by Jade. The range is the Jade the plugin is compiled against.
[[dependencies.${mod_id}]]
modId = "jade"
type = "optional"
versionRange = "[26.1.11,)"
ordering = "NONE"
side = "BOTH"

# Loaded in the dev client to look up the Pillar's recipes, which it shows unaided (#13). Not
# required, and the Pillar has no EMI plugin.
[[dependencies.${mod_id}]]
modId = "emi"
type = "optional"
versionRange = "[0,)"
ordering = "NONE"
side = "CLIENT"

[[mixins]]
config = "${mod_id}.mixins.json"
