// The Module build, every piece of it from the libworks convention plugin (libworks ADR 0003):
// ModDevGradle on Java 25, the game test server that names each test, the jar's licensing, ~/.m2-only
// publishing, and the release, upload and buildGametestStructures tasks.
plugins {
    id 'io.github.5thlayer.libworks.module' version '0.4.5'
}

// What the Module requires of other Modules, each as a range (libworks ADR 0003):
libworks {
    // upstream('groundworks') { range = '[0.4.0,0.5)' }
    // No runtime: a Pillar nests neither libworks-runtime nor, yet, A Touch Of's Runtime (suite
    // ADR-0002, the Pillar's ADR 0002), so its game tests run without libworks-gametest.
}

repositories {
    // EMI for 26.1 is an unofficial port, published on CurseForge only.
    maven {
        url = 'https://cursemaven.com'
        content { includeGroup 'curse.maven' }
    }
    // Jade.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

// Mods the dev client loads alongside the Pillar, to inspect a Bailiff (Jade) and look up recipes
// (EMI) while trying it by hand. 26.1 has no per-run classpath, so they go into the client's mods
// folder, which holds only what is listed here; the game tests run from run/gametest and never load
// them, so they still prove the Pillar plays alone in vanilla.
configurations {
    clientMods { transitive = false }
}

def syncClientMods = tasks.register('syncClientMods', Sync) {
    from configurations.clientMods
    into layout.projectDirectory.dir('run/mods')
}

tasks.named('runClient') { dependsOn syncClientMods }

dependencies {
    // Jade for 26.1.2 is built on NeoForge 26.1.2.76, so it runs on our .77. Jade finds the Pillar's
    // plugin by its annotation, so the Pillar runs without it (#13).
    compileOnly 'maven.modrinth:jade:26.1.11+neoforge'
    clientMods 'maven.modrinth:jade:26.1.11+neoforge'
    // EMI for 26.1 is the unofficial port, only to look up the Pillar's recipes: vanilla's crafting
    // and anvil, which EMI shows unaided, so the Pillar has no plugin and names none of its types.
    clientMods 'curse.maven:emi-unofficial-port-1544558:8630349'
}

neoForge {
    runs {
        // EMI's 26.1 port still carries @OnlyIn, and the dev client halts on a warning screen over it
        // that production never shows. Only the client loads EMI.
        client {
            systemProperty 'neoforge.warnings.onlyin.hide', 'true'
        }
    }
}
